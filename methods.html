(function(){
var P_=AMZ_META.pages;if(!P_.some(function(x){return x[0]==="benchmark.html";})){var i_=P_.findIndex(function(x){return x[0]==="environment.html";});P_.splice(i_<0?P_.length-2:i_+1,0,["benchmark.html","Benchmark"]);}
var A=AMZ, R=AMZ_FAC.match_report;
A.page({title:"Methods and assumptions",sub:"How each domain was built, what it assumes, and what is missing."});

sec("m-general","General rules","<ul><li>Only real, citable sources. Any figure that is not copied from a source is labelled an estimate with its method.</li><li>Retrieval date for every dataset: 2026-10-31. Source URL, publisher, coverage and caveats are on the Sources page.</li><li>No personal data about individual workers. Facility-level injury figures are establishment totals from public OSHA filings.</li><li>All pages are static. Data are embedded in assets/data_*.js and regenerated with scripts/build_master.py then scripts/build_data.py.</li></ul>");
sec("m-fac","Facilities roster","<ul><li>Roster = Amazon-named sites filing OSHA ITA Form 300A (2016-2025) plus TaxJar fulfillment and sort-center lists plus facts from MWPVL's April 2012 table. Name rules (scripts/amazon_names.py, documented in data/notes/injuries.md) include Golden State FC LLC, Prime Now LLC and Amazon's own organisation labels, and exclude contractors, delivery service partners filed under Amazon-like names, Amazon Environmental Inc. and Amazone USA Inc.</li><li>Type (fulfillment center, delivery station, sort center, air hub, other) is assigned by site-code and NAICS rules and is heuristic for about 700 low-confidence rows. Returns centers and cross-docks cannot be identified.</li><li>Each site gets one year by the year basis hierarchy (MWPVL, then EPI or the April 2012 table, then press and news events, then first OSHA filing); the rules, counts and flags are in the Year basis section below. First OSHA filing year is an <i>operating by</i> date, an upper bound on the opening date, and early OSHA compliance was low (see the population note), so a first filing year can be later than the real opening.</li><li>Geocodes: Census street matches where possible, otherwise ZIP-code centroids (approximate, flagged in <span class=\"mono\">geo_method</span>). Every located row is checked automatically: the point must fall inside the row's state (Census 2020 state boundaries) and the ZIP must belong to that state (Census ZCTA-county relationship file). See <span class=\"mono\">scripts/facilities_08_check_geo.py</span> and <span class=\"mono\">data/processed/facility_geo_check.csv</span>. The hand fixes for OSHA typos are listed with reasons in <span class=\"mono\">facility_geo_overrides.csv</span>.</li><li>Master table join: OSHA establishment rows are matched to the roster on site code (parsed from the establishment name), then on street number, street name and ZIP. Match rates: <b>"+A.pct(R.osha_row_match_rate)+"</b> of "+A.fmt(R.osha_rows)+" OSHA establishment-years ("+A.fmt(R.match_method.site_code)+" by site code, "+A.fmt(R.match_method.street_address_zip)+" by address); <b>"+A.pct(R.facility_match_rate)+"</b> of "+A.fmt(R.facilities)+" roster rows have at least one match. Unmatched OSHA rows are mostly Amazon Fresh and Go stores and Prime Now store-type rows (NAICS 445), plus robotics and printing sites and offices, which are outside the logistics roster.</li></ul>");
sec("m-fin","Financial","<ul><li>Income statement, shipping, capital spending and square footage are transcribed from Amazon's 10-K filings (SEC EDGAR). All are company-wide; no state or warehouse-only split exists.</li><li>Fulfillment expense for 1997-98 is embedded in marketing and sales; FY1999 has two definitions; FY1998 is restated for poolings.</li><li>Subsidies: compiled state by state from official records first and then press, one source link per row. Amounts are shown by amount basis (announced maximum, estimated value, realized, annual) and recipient class (direct or public infrastructure) and are never added across bases. Coverage is a floor: no state is marked complete. Earlier figures from search-result snippets of the Good Jobs First tracker were removed because they could not be verified; five unverified rows that rested only on such a snippet remain withheld.</li><li>Cross-checks against Mergent Archives, S&amp;P Capital IQ and D&amp;B Hoovers agreed with the 10-K transcriptions; they found one error (FY2016 gross capital purchases, corrected to $7,804m) and one definitional difference (database PP&amp;E includes operating-lease right-of-use assets from 2019; this page does not). Prologis and UPS shares are facts cited from licensed databases, not republished data.</li><li><b>Financial page assumptions.</b> All dollar series are nominal (not inflation-adjusted) and company-wide; no allocation to US warehouses is attempted. Fulfillment expense covers fulfillment and customer-service centers and payment processing (from FY2017 also physical stores); sortation and delivery-center costs are in cost of sales as shipping costs, not in fulfillment. Its definition was widened in FY1999, so 1997-2001 is not comparable with later years. Outbound shipping cost from 2017 is rounded to $0.1bn in the filings; net shipping cost and shipping revenue were reported only through the years charted. Capital purchases include AWS data centers and servers. Square footage lines are Amazon's Item 2 categories as printed: the 'fulfillment, data centers and other' bucket mixes warehouses with data centers, and the North America segment includes Canada, Mexico and physical stores. Parcel volumes are Pitney Bowes industry figures, restated between editions. Subsidy amounts are as stated in the cited source and are not adjusted for inflation or overlap. No value on this page is interpolated or modelled; the only derived number is fulfillment as a percent of net sales. Charts use the shared inline-SVG helpers in common.js (no CDN library), so the page works from file://.</li></ul>");
sec("m-lab","Labor","<ul><li>Employees are worldwide year-end counts from 10-Ks. Wages are Amazon's announced floors, whose definition changes by year.</li><li>BLS QCEW uses NAICS 493 and 492. QCEW does not identify employers, so these series describe the industry (all employers), not Amazon.</li><li>NLRB: a keyword match on case name; dispositions are inferred from partial docket text.</li><li><b>Labor page assumptions.</b> Amazon headcount (worldwide, all roles) and NAICS 493 employment (US, all employers, private ownership) are plotted together as context and are not combined into a share. The hourly industry wage is the QCEW average weekly wage divided by 40, an assumption: QCEW has no hours, so the figure is an estimate and probably understates the true hourly wage where average hours are under 40. Amazon pay points are announced averages or floors ('more than') for US fulfillment and transportation staff; the definition changes between 'starting' and 'base' pay, the 2021 point comes from a later release, and the total-compensation line includes Amazon's valuation of benefits. County analysis uses today's roster of sites for every year and drops counties BLS suppresses, so the share is a lower-bound descriptive measure, not a measure of Amazon's effect on local employment. State employment change is 2019 to 2025 for all employers in NAICS 493. The NLRB counts include delivery-partner joint-employer cases and keyword false positives, and 2026 is partial. Turnover estimates are secondary press summaries and are not charted.</li></ul>");
sec("m-inj","Injuries","<ul><li>Amazon rates come from OSHA ITA Form 300A: rate = cases x 200,000 / hours worked, hours-weighted across sites. Sites with fewer than 1,000 hours, or outside 300 to 4,500 hours per employee, are excluded. The same filter is used for the headline series, the state series, the site histogram and the site table.</li><li>Benchmark rates come from BLS SOII (national, NAICS 493110 and 492110 equivalents). BLS includes Amazon in its own sample, and the two sources use different survey methods, so ratios are indicative.</li><li>Amazon moved many sites from NAICS 493110 to 492110 from CY2021; the combined logistics series avoids that break.</li><li>CY2025 ITA data are partial; 2016 has too few Amazon rows to use.</li><li><b>Who is counted as Amazon.</b> Rules in scripts/amazon_names.py (see data/notes/injuries.md): company names Amazon.com*, Amazon Retail LLC, Golden State FC LLC (Amazon's California fulfillment entity, 2017 and 2018), Prime Now LLC and a few Amazon units, bare \"Amazon\" with a blank or Amazon EIN, and Amazon's own organisation labels in the establishment name. Excluded: delivery service partners filed under an Amazon-like name, Amazon Environmental Inc., Amazone USA Inc. and contractors such as ABM.</li><li><b>Size mismatch with BLS.</b> Amazon's filers are large establishments (typically hundreds of employees), while the BLS SOII rates cover establishments of all sizes. Injury rates vary with establishment size, so the Amazon-to-BLS ratio mixes a size difference with any real difference. A BLS comparison restricted to large establishments would be better; the BLS size-class tables could not be retrieved here, so none is shown.</li></ul><h3>injuries.html assumptions</h3><ul><li>Charts show 2017 to 2024 only. 2016 has one Amazon establishment; CY2025 OSHA data are partial (through 2026-08-31) and BLS 2025 is unpublished.</li><li>The headline Amazon series is the combined NAICS 493110 + 492110 filers, because Amazon moved many sites between the two codes from 2021. The benchmark lines are BLS national private-industry rates for 493110, 4921 and all industry; they include Amazon.</li><li>The site histogram uses valid establishment-years joined to the roster (90.9% of Amazon OSHA rows match; unmatched rows are mainly Amazon Fresh, Go and Prime Now store-type rows). Default filter is at least 100,000 hours worked, because rates at small sites are dominated by one or two cases. Bins are fixed bands; the hours-weighted line is computed on the filtered set and can differ slightly from the headline series (it also needs a roster match, and sites are restricted by the minimum-hours control). Bars at 1.5 times the BLS rate or above are coloured red; the 1.5 cut-off is a display choice, not a standard.</li><li>The state chart uses all Amazon-named establishments (not only logistics) with at least 5 establishments, and has no state benchmark.</li><li>Ratios (Amazon divided by BLS) are computed in the page from rounded BLS rates. The comparison says nothing about causes.</li></ul>");
sec("m-env","Environment (screening estimates)","<p><b>All facility-level environmental figures are estimates.</b> Amazon publishes no facility-level energy, fuel or truck data.</p><ul><li>Electricity = floor area x CBECS 2018 warehouse intensity (low 3.4, central 5.8, high 12.6 kWh per sq ft). CBECS covers small warehouses on average and may understate large automated sites.</li><li>Grid emissions = electricity x EPA eGRID subregion CO2e rate of the nearest eGRID2023 plant (approximate near borders).</li><li>Natural gas: 11.38 kBtu per sq ft derived from CBECS, x0.5 to x2 range, EPA GHG Hub factor 53.06 kg CO2 per mmBtu.</li><li>Trucks: <b>not estimated: no primary trip-rate source.</b> An earlier version used trip rates read from search snippets. The one primary document located, the South Coast AQMD High Cube Warehouse Truck Trip Study (CE-CERT memo of 7 Aug 2014 and the July 2014 summary slides), reports 0.33 to 1.10 truck trips per 1,000 sq ft per day, but it excludes e-commerce and parcel warehouses as outliers, so it does not describe fulfillment centers. The Rule 2305 (WAIRE) reports do not publish a per-building rate. No per-site truck columns or totals are published. Last-mile vans are not modelled either.</li><li>Because most sites have no known floor area, the master table reports intensity per 1,000,000 sq ft. Totals (electricity and natural gas only) appear only for the sites with a sourced (2012) area.</li><li>Company totals (Scope 1, 2, 3) are Amazon's own reported figures, global and market-based; report vintages differ after a 2022 restatement.</li></ul><h3>environment.html assumptions</h3><ul><li>Reported figures (Scope 1, 2, 3, intensity, renewables) are transcribed from Amazon sustainability reports; the 2025 report edition is used for trends and all three editions are shown to expose restatements. They are global.</li><li>All site figures are screening estimates per 1,000,000 sq ft, computed in the pipeline (scripts/env_04_screening_model.py) with the parameters in the table on the page. Low, central and high are assumption brackets, not confidence intervals. No facility total is shown unless a sourced floor area exists (31 sites, from a 2012 third-party table).</li><li>The map colours sites by eGRID2023 subregion CO2e rate (quintiles of the sites). 475 sites are positioned at a ZIP-code centroid and can be hidden; 30 have no coordinates and no estimate.</li><li>The subregion bar chart averages the per-site central estimate, which varies only through the grid factor.</li><li>Nearby population is total 2020 population within 20 or 50 miles. No demographics (ACS) or pollution-burden data were used; none are implied.</li><li>Air-hub emissions are not estimated. The permit table is an ICIS-Air name search and the impervious figure is a point sample of NLCD 2021.</li></ul>");
sec("m-log","Logistics","<ul><li>No continuous series of facility counts by type exists in public sources. This site shows 10-K square footage (2004-2025), distinct OSHA site codes (2016-2025, a lower bound) and one 2025 per-type snapshot from Moraine Research.</li><li>Air fleet, DSP and milestone rows rest partly on secondary sources; each row carries a confidence label and URL.</li></ul>");
sec("m-pop","Population access","<ul><li>Population: 2020 Census population-weighted tract centroids (84,414 tracts, 50 states and DC; total "+A.fmt(AMZ_POP.by_year.rows[0][5])+"). Distance: straight-line (haversine) miles from tract centroid to site. A tract counts as within 20 or 50 miles if any site of the set lies within that distance.</li><li>The same 2020 population is used for every year; only the set of sites changes. Sites for a year are those with a matched OSHA filing in that calendar year. Form 300A electronic submission has covered NAICS 4931 establishments with 20 or more employees since the 2016 data year, and the 2019 and 2023 rules changed only Forms 300 and 301, so rising shares reflect network growth and improving compliance (2016 data were collected late and compliance was low in the first years), not rule changes. Years before 2016 are not computed because this series counts sites by their OSHA filings, which start with the 2016 data year.</li><li>Tract centroids approximate where people live inside large rural tracts.</li></ul>");
function FB(k){return AMZ.fmt(AMZ.rows(AMZ_FAC.facilities).filter(function(r){return r.year_basis===k||(k==="undated"&&!r.year_basis);}).length);}
function FF(k){return AMZ.fmt(AMZ.rows(AMZ_FAC.facilities).filter(function(r){return String(r.year_flag||"").split(";").indexOf(k)>=0;}).length);}
sec("m-map","Map page (map.html)","<ul><li>Which sites are drawn: every roster site with coordinates (1,731 of 1,761). 30 sites have none and are only in the facilities table.</li><li>Year slider, 1997 to 2026, and the <b>year basis hierarchy</b> (fields <span class=\"mono\">year_used</span>, <span class=\"mono\">year_basis</span>, <span class=\"mono\">year_source</span> and <span class=\"mono\">year_flag</span> in facilities_master.csv, shown in every popup and in the legend above the map). Each site gets one year from the first of: (1) <b>MWPVL opening year</b> (<span class=\"mono\">mwpvl_opening_year</span>, "+FB("mwpvl_opening_year")+" sites), read from archived copies of MWPVL International's Amazon table (Wayback Machine captures from 2012 to 2026; mwpvl_wayback_sites_all.csv with mwpvl_corrections.csv applied; where captures disagree the most common year is used; projection years for planned sites are skipped); (2) the <b>EPI or MWPVL 2012 opening year</b> (<span class=\"mono\">epi_mwpvl2012_opening_year</span>, "+FB("epi_mwpvl2012_opening_year")+" sites); (3) a <b>press or database event year</b> (<span class=\"mono\">press_event_year</span>, "+FB("press_event_year")+" sites): an opening date stated in a news or database item (facility_events_all.csv), exact or probable match to the roster site with state and type consistent, dated 2026 or earlier; (4) <span class=\"mono\">first_osha_filing</span>, the first OSHA ITA filing year (2016 onward; "+FB("first_osha_filing")+" sites), which means the site was <i>operating by</i> then and is an upper bound on the opening date. Sites with none of these ("+FB("undated")+") appear in 2026. The map shows the first year of evidence, not always the opening year. Sites are never removed because closing dates are mostly unknown.</li><li><b>Year flags</b> (<span class=\"mono\">year_flag</span>): <span class=\"mono\">mwpvl_year_conflict</span> (captures disagree; "+FF("mwpvl_year_conflict")+" sites), <span class=\"mono\">mwpvl_later_year_after_planned</span> (MWPVL first listed the site as planned and later moved the year; "+FF("mwpvl_later_year_after_planned")+"), <span class=\"mono\">mwpvl_projection_not_used</span> ("+FF("mwpvl_projection_not_used")+"), <span class=\"mono\">year_after_first_osha_filing</span> (the MWPVL year is later than a filing the site had already made; "+FF("year_after_first_osha_filing")+"; the MWPVL year is still used). MWPVL's years are its own compilation and are not Amazon records. The previous basis values (opening_year, press_opening_year, first_osha_filing) are kept in <span class=\"mono\">year_basis_legacy</span>.</li><li><b>Pullback layer</b>: <span class=\"mono\">pullback_status</span>, <span class=\"mono\">pullback_date</span> and <span class=\"mono\">pullback_history</span> in facilities_master.csv, from pullback_sites.csv joined on site code (or on a unique city, state and type). The strongest status wins when a site has several (closed, closed temporary, closed partial, sublease, paused, delayed, removed from MWPVL list); the popup lists all of them. A badge appears when the first pullback date is on or before the slider year. <b>Removed from MWPVL list is not a closure</b>: it only means the site left that list in a capture. Pullback rows with no site code, and cancelled projects, cannot be placed and are in a table under the map. Source rows are reports and overlap one another.</li><li>Trade-press source (data/processed/industry_trade_press_openings.csv, article rows): a list of what trade and local press reported, found by search. It is <b>reported, not complete or verified</b>. It feeds the toggle layer only; the year hierarchy uses the broader facility-events table. The toggle layer draws every row that can be placed: matched rows at the roster site, unmatched rows at a Census 2020 Gazetteer city, town or county centroid, marked approximate (dashed outline). Marker fill shows confidence (solid high, half medium, hollow low). Rows with no city or state are not drawn. The layer is not filtered by the slider.</li><li>Consequences: the map is nearly empty before 2017 and nearly flat 2012 to 2016, which is a data gap. Growth after 2016 mixes real openings with improving compliance with the OSHA 300A requirement (in force for warehousing sites of 20 or more employees since the 2016 data year; 2016 data were collected late and compliance was low at first) and wider coverage of the roster match. It is not caused by rule changes.</li><li>Location precision: 966 sites are street-level Census geocodes, 290 are Census non-exact matches (still address-based), 475 are ZIP-code centroids and drawn as dashed hollow circles; a checkbox hides them. A ZIP centroid can be several miles from the building.</li><li>Type colours are the first five slots of a categorical palette checked with the dataviz validator (light and dark; light mode fails the 3:1 contrast guideline for three slots, so every mark has a legend with counts, a hover and popup, and a table view). Type itself is inferred in the roster build and can be wrong for single sites.</li><li>Early-openings layer: dashed county markers show cumulative fulfillment-center openings from the EPI list (1997 to 2017, labelled as EPI on the page). It is a different source from the roster dots, it ends in 2017, and it is not merged into the roster counts.</li><li>The readout beside the slider shows 10-K square footage (FY2004 on) or the early US fulfillment-center counts (FY2000 to FY2003) as context. These are company-wide and not on the same basis as the dots.</li><li>Base tiles come from OpenStreetMap through Leaflet 1.9.4 on cdnjs, so the map needs an internet connection. Without it the counts, chart and table still render.</li></ul>");
sec("m-logpage","Logistics page (logistics.html)","<ul><li>Sites by type per year: distinct roster facilities with a matched OSHA ITA filing that year, grouped by the roster's inferred type (AMZ_FAC.osha_by_year joined to facilities). It measures who filed, which is a lower bound on operating sites. 2016 has one site and is omitted; 2025 is partial and appears only in the table.</li><li>The NAICS-group chart (AMZ_LOG.osha_site_counts) counts every Amazon-named site code, so its totals exceed the roster counts (for example 2023: 1,183 against 1,135). The movement between the 493110 and 492110 lines in 2021 is read as a change in how sites were classified; that is an inference from the counts.</li><li>The year-on-year space growth line is computed here from the 10-K North America total (this year over last year minus 1). It is not an Amazon figure. The series includes AWS data centers and its definition changes across years.</li><li>Moraine Research counts are one third-party snapshot (30 Sept 2025); categories overlap and the page shows them as separate bars, not as parts of a total.</li><li>Amazon Air counts are shown as separate dated reports because definitions differ (leased versus operated versus listed). The 2021 purchase of 11 aircraft is a purchase, not a fleet total, and is left out of the bar chart. Two fleet figures and the DSP 2023 and 2024 figures come from search summaries and are tagged low confidence.</li><li>DSP counts and driving jobs are worldwide, not US; the 2024 jobs figure may be cumulative (unverified).</li><li><b>Industry layers (added from the industry search).</b> Pitney Bowes parcel volume and share: one point per data year from the edition covering that year, labelled with the release date; editions restate earlier years, so the line is not one consistent series, and the 2019 to 2021 values come from trade-press reproductions. EPI openings 1997 to 2017: 95 fulfillment centers by state, county and quarter from Appendix Table 3 of Zipperer and Jones (2018); the 2018 MWPVL update (120 by 2017) is not itemized and shown only as reported totals; fulfillment centers only, and county positions on the map page are Census 2020 county centroids, not buildings. Robot counts: seven reports at irregular dates, shown as separate bars with confidence labels (not a time series; early counts are US Kiva drive units, later ones worldwide and all robot types). Notes: data/notes/industry_sources.md.</li><li><b>MWPVL, pullback, events and market layers.</b> Openings by year and type: roster sites grouped by <span class=\"mono\">mwpvl_year</span> and the roster's inferred type, with MWPVL's own per-year table counts (AMZ_MWPVL.openings_by_year) as marks; the roster holds only part of the table, and the page states the share. Projection years are hatched and not used as openings. Pullback timeline: AMZ_PULL.sites counted by quarter of the report or capture date; rows dropped from MWPVL's list are dated by the first capture without the site and are not confirmed closures; the same project can appear in several reports. Published tallies (AMZ_PULL.aggregates) have different scopes, overlap and are not added. MWPVL status chart: AMZ_MWPVL.status_by_snapshot summed over table types; captures that list far fewer sites than their neighbours (below 60 percent of the median of the captures within two places either side) are treated as incomplete reads and left out of the lines, and the page lists them; captures to 2016-02-24 are read from text, later ones from table images. Facility events: AMZ_EVENTS.events, one row per report, cited by publication and date, joined to the roster only for exact or probable matches. Market context: AMZ_MARKET.rows next to the Pitney Bowes editions; ShipMatrix shares and Amazon's share of UPS revenue are different measures from the Pitney Bowes volume share. Subscription databases are named only as the access route; no article passages are reproduced.</li><li>Population coverage uses 2020 population for every year and straight-line distance; only the site set changes, so it measures reach of the filing-visible network. Years 2017 to 2024 are charted. The full set of site sets is in the table view.</li></ul>");
sec("m-deals","Logistics deals (logistics.html and benchmark.html)","<ul><li>The deal lists (AMZ_DEALS, data/processed/logistics_deals_public.csv, built by scripts/make_public_deals.py) start from deals found in PitchBook, read through the Johns Hopkins University Libraries subscription. PitchBook data are licensed and are not redistributed: no database descriptions, identifiers or links are published.</li><li>Each deal was then searched for in public sources (75 automatic web searches). A deal is published only if a public page was matched to it. The automatic match was checked by hand and 15 weak matches were removed; three more rows (two data-center site purchases, and a deal whose only cited article is dated a year after it) were dropped when the public table was built. Every remaining row was then checked against its cited page for year, parties and amount (2026-10-31): three more were dropped (an investment the article attributes to Jeff Bezos personally rather than Amazon, a stake disclosure that was not a new transaction, and a land purchase for a retail store), four sources were replaced with pages that state the deal, and six rows were corrected (two years, two investor labels, two seller names). The result is 49 rows (32 Amazon, 17 Walmart and Target). Years follow the database date except where the cited page dates the deal to a different year.</li><li>Amounts are published only when the cited page states them: 12 matched in the page title or summary, plus 8 read on the page itself during the source check, where the article's figure is used rather than the database's (20 of 49 rows). They are the size of the round or purchase, not the buyer's or investor's share, and are blank otherwise. Day and month are not published.</li><li>The list is incomplete. The Industrial Innovation Fund is not a database entity, so its deals appear only through the target company. Delivery-van stakes other than Rivian, sale-leasebacks and delivery partner data are absent. The database stopped serving profile pages partway through collection, so peer coverage is thinner. Property purchases are labelled by seller where known and are not all confirmed logistics sites. Walmart and Target counts are not comparable with Amazon counts.</li></ul>");
sec("m-bench","Benchmark page (benchmark.html)","<ul><li>Source tables are the bench_* files in data/processed/ (loaded as AMZ_BENCH). Findings, exclusions and caveats are in data/notes/benchmark_findings.md and the bench_*.md notes. Each chart cites its file and the original publisher and has a table view.</li><li><b>Injuries.</b> OSHA ITA Form 300A, CY2024 (trend 2017 to 2024). Rates are cases x 200,000 / hours, hours-weighted across valid sites (TRC all recordable cases; DART days away, restricted or transferred; DAFW days away). Only rows with headline scope and headline_comparison_ok are plotted. FedEx Ground 2024 is excluded because its filings cover about June to December; FedEx Express is marked supplementary. Amazon is NAICS 493 plus 492 and peers are 493110, so the Amazon-to-peer ratio is slightly understated. Peers are matched by establishment name; Sam's Club DCs filed under Walmart cannot be separated; Target, Costco and the other single-company peers have few sites, so their rates are thin. 2025 is partial and omitted. In the percentile strip the 25th percentile is zero because many small sites report no cases. The BLS 493110 line is a national survey rate that includes Amazon.</li><li><b>Network and finance.</b> Revenue per employee and capital spending as a percent of revenue are company-wide figures from 10-K XBRL (Walmart year ended Jan 2025, FedEx year ended May 2025, others calendar 2024). Amazon capital spending includes AWS data centers. Facility counts and square feet come from Item 2, were script-parsed and only partly confirmed, and are not comparable across companies; the table is not ranked and revenue per square foot is not shown.</li><li><b>Labor.</b> Announced pay is divided by the QCEW NAICS 493 average weekly wage converted to a 40-hour hourly equivalent. The denominator includes Amazon and is an average, so a starting wage is not like-for-like. The latest announcement per company is shown, preferring warehouse-specific rows; prior-contract rows are dropped. OEWS premiums compare mean hourly wages for two occupations in NAICS 493 with all private industry. NLRB counts are CA charges filed in 2024 matched by company name only; rates divide by worldwide 10-K headcount; FedEx has no rate in the file.</li><li><b>Environment.</b> Scope 1 plus 2 market-based tonnes divided by company revenue, latest year per company. Scope 3 is not compared. Amazon Scope 2 includes AWS; Target is derived from percent changes; Home Depot uses FY2025 because earlier computed values do not match its reported intensity. Clean-energy shares have different definitions and are listed, not ranked.</li><li><b>Industry baseline.</b> Amazon's share of NAICS 493 employment is the sum of OSHA-reported average employees over QCEW private employment. It is an estimate, not a bound. 2019 and 2020 are blank because two project files disagree and filing coding changed; 2016 is unusable. Temp-agency workers are excluded.</li></ul>");
sec("m-gaps","Known gaps","<ul><li>Closing dates for almost every site, and opening dates for sites no source dates (see the year basis table); square footage per site; returns centers and cross-docks.</li><li>Subsidy records (Good Jobs First's tracker could not be retrieved, so the totals are a floor).</li><li>Truck emissions per site: no primary trip-rate source for fulfillment centers.</li><li>A BLS comparison by establishment size: the BLS size tables and the series needed for it could not be retrieved.</li><li>BLS SOII for 2025; OSHA case-detail (injury type) files; Census ACS demographics (needs an API key).</li><li>Statista was not used. Some trade-press rows were found through ProQuest; they carry no public link and appear on the map without a quote.</li></ul>");
})();
